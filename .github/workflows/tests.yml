name: Tests

on:
  push:
  pull_request:
permissions:
  contents: read


jobs:
  stable:
    name: Test @stable deps
    uses: ./.github/workflows/run-tests.yml

  dev:
    name: Test @dev deps
    uses: ./.github/workflows/run-tests.yml
    with:
      deps: dev
      continue_on_error: true

  lowest:
    name: Test --prefer-lowest deps
    uses: ./.github/workflows/run-tests-lowest.yml

  test-32bit:
    name: Test 32-bit
    uses: ./.github/workflows/run-tests-32bit.yml

  downstream:
    name: Test downstream projects
    uses: ./.github/workflows/run-downstream.yml
    with:
      continue_on_error: true

  build:
    name: Test Phar build
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '7.4'
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 5
          max_attempts: 5
          command: composer update --no-interaction --no-progress

      - name: Build Phar binaries
        run: make build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: binaries
          path: build/*/psysh

      - name: Smoke test
        run: make smoketest

      - name: PTY smoke test
        run: test/smoketest-pty.sh build/psysh/psysh

  phar:
    name: Test Phar
    needs: build
    uses: ./.github/workflows/run-phar-tests.yml
